$kind: http-request
url: "{{baseUrl}}/api/horarios"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "terapistaId": 6,
      "diaSemana": 2,
      "horaInicio": "15:00",
      "horaFin": "10:00"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 400", function () { pm.response.to.have.status(400); });
      pm.test("Mensaje de error", function () { pm.expect(pm.response.json().message).to.include("La hora de inicio debe ser menor que la hora de fin"); });
    language: text/javascript
order: 8000
