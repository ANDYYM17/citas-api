$kind: http-request
url: "{{baseUrl}}/api/horarios/dia/6"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Día y orden por hora de inicio", function () { const datos = pm.response.json(); pm.expect(datos).to.be.an("array").that.is.not.empty; datos.forEach((horario, i) => { pm.expect(horario.diaSemana).to.eql(6); if (i > 0) { pm.expect(datos[i - 1].horaInicio <= horario.horaInicio).to.eql(true); } }); });
    language: text/javascript
order: 3000
