$kind: http-request
url: "{{baseUrl}}/api/horarios/{{horarioCreadoId}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "terapistaId": 6,
      "diaSemana": 1,
      "horaInicio": "09:00",
      "horaFin": "13:00"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Horas actualizadas", function () { const datos = pm.response.json(); pm.expect(datos.id).to.eql(Number(pm.collectionVariables.get("horarioCreadoId"))); pm.expect(datos.horaInicio).to.match(/^09:00(:00)?$/); pm.expect(datos.horaFin).to.match(/^13:00(:00)?$/); });
    language: text/javascript
order: 11000
