$kind: http-request
url: "{{baseUrl}}/api/horarios"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Lista con horarios de prueba", function () { pm.expect(pm.response.json()).to.be.an("array").that.is.not.empty; });
    language: text/javascript
order: 1000
