$kind: http-request
url: "{{baseUrl}}/api/horarios/1"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Horario solicitado", function () { pm.expect(pm.response.json().id).to.eql(1); });
    language: text/javascript
order: 4000
