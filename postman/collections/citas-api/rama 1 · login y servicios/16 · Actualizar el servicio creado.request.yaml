$kind: http-request
url: "{{baseUrl}}/api/servicios/{{servicioCreadoId}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "titulo": "{{tituloPrueba}}",
      "descripcion": "Masaje en puntos de los pies",
      "costo": 90,
      "duracion": 40,
      "foto": null,
      "activo": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Costo y estado actualizados", function () { const datos = pm.response.json(); pm.expect(datos.id).to.eql(Number(pm.collectionVariables.get("servicioCreadoId"))); pm.expect(datos.costo).to.eql(90); pm.expect(datos.activo).to.eql(false); });
    language: text/javascript
order: 16000
