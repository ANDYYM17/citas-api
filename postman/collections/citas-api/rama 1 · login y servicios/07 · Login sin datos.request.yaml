$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "",
      "password": ""
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 400", function () { pm.response.to.have.status(400); });
      pm.test("Errores de validación", function () { pm.expect(pm.response.json().errors).to.be.an("array").that.is.not.empty; });
    language: text/javascript
order: 7000
