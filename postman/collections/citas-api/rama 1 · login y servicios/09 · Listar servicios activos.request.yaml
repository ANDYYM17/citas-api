$kind: http-request
url: "{{baseUrl}}/api/servicios/activos"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Todos los servicios están activos", function () { const datos = pm.response.json(); pm.expect(datos).to.be.an("array").that.is.not.empty; datos.forEach(servicio => pm.expect(servicio.activo).to.eql(true)); });
    language: text/javascript
order: 9000
