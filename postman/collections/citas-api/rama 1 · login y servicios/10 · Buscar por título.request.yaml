$kind: http-request
url: "{{baseUrl}}/api/servicios/buscar?titulo=terapia"
method: GET
headers:
  Accept: application/json
queryParams:
  titulo: terapia
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Resultados coincidentes", function () { const datos = pm.response.json(); pm.expect(datos).to.be.an("array").that.is.not.empty; datos.forEach(servicio => pm.expect(servicio.titulo.toLowerCase()).to.include("terapia")); });
    language: text/javascript
order: 10000
