$kind: http-request
url: "{{baseUrl}}/api/terapistas/activos"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Todas las terapistas están activas", function () { const datos = pm.response.json(); pm.expect(datos).to.be.an("array").that.is.not.empty; datos.forEach(terapista => pm.expect(terapista.activo).to.eql(true)); });
    language: text/javascript
order: 2000
