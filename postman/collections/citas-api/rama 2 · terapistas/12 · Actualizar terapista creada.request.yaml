$kind: http-request
url: "{{baseUrl}}/api/terapistas/{{terapistaCreadaId}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "usuarioId": 23,
      "nombres": "Valeria",
      "apellidos": "Torres Rojas",
      "dni": "49012345",
      "telefono": "987100299",
      "activo": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Datos actualizados", function () { const datos = pm.response.json(); pm.expect(datos.id).to.eql(Number(pm.collectionVariables.get("terapistaCreadaId"))); pm.expect(datos.usuarioId).to.eql(23); pm.expect(datos.telefono).to.eql("987100299"); });
    language: text/javascript
order: 12000
